name: Validate Longer Bobo Editing
on:
  pull_request:
    paths: ['fresh_bobo.py', '.github/workflows/test-fresh-bobo.yml']
  push:
    branches: [main]
    paths: ['fresh_bobo.py', '.github/workflows/test-fresh-bobo.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video tools
        run: |
          pip install gradio_client numpy socksio piper-tts==1.3.0
          mkdir -p voice_models
          (cd voice_models && python -m piper.download_voices en_US-ljspeech-medium)
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Check compilation, three-shot assembly, sound variants and final export
        env:
          HF_TOKEN: offline-test
          PUBLISH_FACEBOOK: 'false'
          EPISODE_SLOT: '0'
        run: |
          python -m py_compile fresh_bobo.py
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          import fresh_bobo as b
          class OfflineGenerator:
              calls=0
              def __init__(self,*args,**kwargs): pass
              def predict(self,**kwargs):
                  assert kwargs['duration_seconds']==4
                  assert kwargs['steps']==4
                  path=Path(f'offline_source{self.calls}.mp4')
                  subprocess.run(['ffmpeg','-v','error','-y','-f','lavfi','-i','testsrc2=size=256x448:rate=16','-t',str(kwargs['duration_seconds']),'-c:v','libx264','-pix_fmt','yuv420p',str(path)],check=True)
                  self.calls+=1
                  return str(path), kwargs['seed']
          b.Client=OfflineGenerator
          import bobo_pipeline
          bobo_pipeline.approvals=lambda: {}
          Path('bobo_quota.json').unlink(missing_ok=True)
          Path('bobo_review_pending.json').unlink(missing_ok=True)
          Path('published_bobo.json').write_text('{}')
          b.main()
          metadata=json.loads((b.OUT/'episode.json').read_text())
          cues=metadata['caption_timing']
          assert metadata['voice']['enabled'] is True
          assert metadata['finishing_required'] is True
          assert len(cues)==1, 'Only exact speech subtitle before observed finishing'
          assert (b.OUT/'shot2.mp4').is_file()
          source_info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',str(b.OUT/'generated.mp4')]))
          assert float(source_info['format']['duration'])>=11, 'No frozen padding'
          dialogue=json.loads((b.OUT/'dialogue-timing.json').read_text())
          spoken=dialogue['cues'][0]
          assert cues[0]['text']==spoken['text']
          assert cues[0]['start']==spoken['start'] and cues[0]['end']==spoken['end']
          assert all(c['start']>=spoken['end']+.079 for c in cues[1:])
          assert (b.OUT/'voice-track.wav').is_file()
          assert '\n' in (b.OUT/'captions.srt').read_text()
          assert '-->' in (b.OUT/'captions.srt').read_text()
          assert metadata['music_check_dbfs'] > -30
          assert Path(metadata['quality_reference']).read_bytes() == (b.OUT/'reference.png').read_bytes()
          assert metadata['setting'] and metadata['scene_id'] in range(8)
          assert '#'+b.SCENES[metadata['scene_id']][-1][0] in metadata['social_caption']
          assert (b.OUT/'facebook-caption.txt').is_file()
          for variant in range(8):
              b.soundtrack(11,variant)
              data=(b.OUT/'audio.wav').read_bytes()
              Path(f'audio-hash-{variant}.txt').write_text(hashlib.sha256(data).hexdigest())
          hashes={Path(f'audio-hash-{v}.txt').read_text() for v in range(8)}
          assert len(hashes)==8
          p=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration:stream=width,height,codec_name,r_frame_rate','-of','json',str(b.OUT/'bobo_fresh.mp4')]))
          assert abs(float(p['format']['duration'])-11)<.1
          assert p['streams'][0]['width']==720 and p['streams'][0]['height']==1280
          assert p['streams'][0]['r_frame_rate']=='30/1'
          assert any(s['codec_name']=='aac' for s in p['streams'])
          assert (b.OUT/'continuation.png').is_file()
          assert (b.OUT/'reference.png').is_file()
          for kind in ['quiet','silent','missing']:
              target=b.OUT/(kind+'.mp4')
              args=['ffmpeg','-v','error','-y','-i',str(b.OUT/'bobo_fresh.mp4'),'-c:v','copy']
              args+=['-an'] if kind=='missing' else ['-af','volume='+('0' if kind=='silent' else '0.001'),'-c:a','aac']
              subprocess.run(args+[str(target)],check=True)
              assert b.music_level(target)<-30
              assert b.ensure_audible_music(target,0)>-24
          print('Validated: mandatory local Bobo voice, exact spoken subtitle timing, three shots, 11-second export, distinct music, 720x1280, 30 FPS and AAC.')
          PY
