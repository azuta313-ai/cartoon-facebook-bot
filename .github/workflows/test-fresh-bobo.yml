name: Test Fresh Bobo Generation
on:
  pull_request:
    paths: ['fresh_bobo.py', '.github/workflows/test-fresh-bobo.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: free-bobo-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generator and video tools
        run: |
          pip install gradio_client numpy socksio
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Generate one new six-second episode using free GPU quota
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EPISODE_SLOT: '0'
        run: python fresh_bobo.py
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-bobo-review
          path: fresh_output/
          if-no-files-found: error
