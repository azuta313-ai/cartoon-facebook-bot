name: Finish Observed Bobo Draft
on:
  push:
    paths: ['bobo_finishing_plan.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: free-bobo-generation
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path('bobo_finishing_plan.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('run_id='+str(int(p['artifact_run_id']))+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: fresh-bobo-video
          path: source
          run-id: ${{ steps.plan.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install numpy gradio_client piper-tts==1.3.0
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          mkdir -p voice_models
          cd voice_models
          python -m piper.download_voices en_US-ljspeech-medium
      - run: python finish_bobo_observed.py
      - run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads(Path('bobo_finishing_plan.json').read_text())
          p={'episode':p['episode'],'artifact_run_id':os.environ['GITHUB_RUN_ID'],'status':'awaiting_visual_audio_review','source_sha256':p['source_sha256']}
          Path('bobo_review_pending.json').write_text(json.dumps(p,indent=2))
          PY
          git config user.name 'Bobo automation'
          git config user.email 'bobo-bot@users.noreply.github.com'
          git add bobo_review_pending.json
          git commit -m 'Hold repaired artifact for exact-file review'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-bobo-video
          path: fresh_output/
          retention-days: 30
