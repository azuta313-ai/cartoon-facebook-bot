name: Generate Bobo AI Story

on:
  workflow_dispatch:

jobs:
  generate-story:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate five Bobo scenes
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          python generate_bobo_story.py

      - name: Save Bobo story scenes
        uses: actions/upload-artifact@v4
        with:
          name: bobo-ai-story-scenes
          path: |
            bobo_scene_1.png
            bobo_scene_2.png
            bobo_scene_3.png
            bobo_scene_4.png
            bobo_scene_5.png
