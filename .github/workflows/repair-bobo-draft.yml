name: Repair Bobo Review Draft
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-bobo-draft.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: free-bobo-generation
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install numpy
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - uses: actions/download-artifact@v4
        with:
          name: fresh-bobo-video
          path: draft
          run-id: 38431045557
          github-token: ${{ github.token }}
      - name: Align observed button contacts and preserve 11 seconds
        env:
          REPAIR_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,sys,types
          from pathlib import Path
          draft=Path('draft')
          source=draft/'generated.mp4'
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='33203acde33fec8b8b4fcd0863640076b7167dac5ef4c3fb20f67ece8517ae84'
          pending=json.loads(Path('bobo_review_pending.json').read_text())
          assert pending['episode']==40522027
          sys.modules['gradio_client']=types.SimpleNamespace(Client=None,handle_file=None)
          scope={'__name__':'repair'}
          src=Path('fresh_bobo.py').read_text().replace("[('beep',split+.2,.15),('beep',split+.6,.15),('chime',split+1,.35)]","[('beep',2.65,.15),('beep',5.70,.15)]")
          exec(compile(src,'fresh_bobo.py','exec'),scope)
          scope['OUT']=draft
          scope['soundtrack'](11,5,5.0625,music_variant=29)
          cues=[('Curious Bobo',0,2.5),('Beep!',2.625,3.25),('One more press',4.5,5.625),('Beep!',5.625,6.125),('Captain Bobo!',7,9.75)]
          filters=['hqdn3d=1.0:0.8:1.5:1.2','fps=30','scale=720:1280:force_original_aspect_ratio=increase:flags=lanczos','crop=720:1280','tpad=stop_mode=clone:stop_duration=1.5']
          for i,(text,a,z) in enumerate(cues):
           p=draft/f'fixed-text{i}.txt';p.write_text(text)
           filters.append(f"drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile={p}:fontsize=34:fontcolor=white:box=1:boxcolor=black@0.55:boxborderw=8:x=(w-text_w)/2:y=1160:enable='gte(t,{a})*lt(t,{z})'")
          subprocess.run(['ffmpeg','-v','error','-y','-i',str(source),'-i',str(draft/'audio.wav'),'-vf',','.join(filters),'-af','loudnorm=I=-16:TP=-1.5:LRA=7','-map','0:v:0','-map','1:a:0','-c:v','libx264','-preset','medium','-crf','16','-c:a','aac','-b:a','192k','-ar','48000','-pix_fmt','yuv420p','-t','11','-movflags','+faststart',str(draft/'bobo_fresh.mp4')],check=True)
          subprocess.run(['ffmpeg','-v','error','-i',str(draft/'bobo_fresh.mp4'),'-f','null','-'],check=True)
          meta=json.loads((draft/'episode.json').read_text())
          meta.update(caption_timing=[{'text':t,'start':a,'end':z} for t,a,z in cues],final_sha256=hashlib.sha256((draft/'bobo_fresh.mp4').read_bytes()).hexdigest())
          meta['observed_action_timestamps']={'hand_gestures':'0-2.5','first_button_contact':'2.625-3.25','second_button_contact':'5.625-6.125','turn_and_wave':'6.875-9.75','ending_pose':'9.75-11'}
          meta['caption_effect_mapping']={'beeps':[2.65,5.70],'Captain Bobo!':'7-9.75 actual turn and wave'}
          meta['review_repairs']=['Retimed button captions to observed contacts','Aligned restrained electronic beeps to contacts','Removed arbitrary chime','Preserved distinct music arrangement 29 and 11-second duration']
          (draft/'episode.json').write_text(json.dumps(meta,indent=2))
          (draft/'captions-timing.json').write_text(json.dumps(meta['caption_timing'],indent=2))
          pending.update(status='repaired_awaiting_review',artifact_run_id=os.environ['REPAIR_RUN_ID'],final_sha256=meta['final_sha256'])
          Path('bobo_review_pending.json').write_text(json.dumps(pending,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-bobo-video
          path: draft/
          retention-days: 30
      - run: |
          git config user.name "Bobo automation"
          git config user.email "bobo-bot@users.noreply.github.com"
          git add bobo_review_pending.json
          git commit -m "Record repaired space button draft awaiting exact review"
          git pull --rebase origin main
          git push origin HEAD:main
