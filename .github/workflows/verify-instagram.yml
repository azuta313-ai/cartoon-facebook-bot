name: Verify Instagram Connection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-instagram.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile publish_instagram_reviewed.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Read connected professional account
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os,requests
          s=requests.Session();s.headers['Authorization']='Bearer '+os.environ['FB_PAGE_ACCESS_TOKEN']
          base='https://graph.facebook.com/v26.0/'
          def get(path,params):
              r=s.get(base+path,params=params,timeout=30);d=r.json()
              if not r.ok:
                  e=d.get('error',{})
                  print('Connection check failed: code',e.get('code'),'subcode',e.get('error_subcode'))
                  raise SystemExit(1)
              return d
          page=get(os.environ['FB_PAGE_ID'],{'fields':'instagram_business_account'})
          account=page.get('instagram_business_account',{})
          if not account.get('id'):
              print('No Instagram professional account visible to the configured Page token. instagram_basic and Page authorization need checking.')
              raise SystemExit(1)
          info=get(account['id'],{'fields':'username'})
          print('Connected Instagram username:',info.get('username'))
          # Page tokens do not reliably expose the user permissions edge.
          limit=get(account['id']+'/content_publishing_limit',{'fields':'config,quota_usage'})
          print('Instagram content-publishing access verified:',bool(limit.get('data')))
          response=s.get(base+account['id'],params={'fields':'account_type'},timeout=30)
          details=response.json()
          if response.ok:
              print('Instagram account type:',details.get('account_type'))
              print('Story Business-account requirement met:',details.get('account_type')=='BUSINESS')
          else:
              print('Account-type probe unavailable; code:',details.get('error',{}).get('code'))
          response=s.get(base+account['id']+'/stories',params={'fields':'id','limit':1},timeout=30)
          print('Story read access verified:',response.ok and 'data' in response.json())
          response=s.post(base+account['id']+'/media',data={'media_type':'STORIES','upload_type':'resumable'},timeout=30)
          probe=response.json()
          supported=response.ok and bool(probe.get('id')) and bool(probe.get('uri') or probe.get('upload_uri'))
          print('Unpublished Story upload-session creation verified:',supported)
          if not supported:
              err=probe.get('error',{})
              print('Story eligibility error:',err.get('code'),err.get('error_subcode'),str(err.get('message',''))[:240])
              raise SystemExit(1)
          print('No binary uploaded and no media_publish called. Public Story acceptance awaits a reviewed artifact.')
          PY

