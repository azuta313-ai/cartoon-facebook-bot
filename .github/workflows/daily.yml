name: Daily Fresh Bobo
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the newly generated video to Facebook'
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '10 9,21 * * *'
      timezone: Asia/Karachi
permissions:
  contents: write
concurrency:
  group: free-bobo-generation
  cancel-in-progress: false
jobs:
  fresh-bobo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free generation and video tools
        run: |
          pip install gradio_client numpy socksio
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Generate a fresh episode and publish if enabled
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          PUBLISH_FACEBOOK: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: python fresh_bobo.py
      - name: Record accepted publication to prevent repeat uploads
        run: |
          if [ -f published_bobo.json ]; then
            git config user.name "Bobo automation"
            git config user.email "bobo-bot@users.noreply.github.com"
            git add published_bobo.json
            if ! git diff --cached --quiet; then
              git commit -m "Record fresh Bobo Facebook publication"
              git push origin HEAD:main
            fi
          fi
      - name: Save the new episode
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-bobo-video
          path: fresh_output/
          retention-days: 7
