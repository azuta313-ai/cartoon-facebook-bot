# Retry the outstanding evening slot after deliberate visual rejection, 2026-10-14.
name: Daily Fresh Bobo
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the newly generated video to Facebook'
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths: ['.github/workflows/daily.yml']
  schedule:
    - cron: '10,30,50 9,17,21 * * *'
      timezone: Asia/Karachi
permissions:
  contents: write
concurrency:
  group: free-bobo-generation
  cancel-in-progress: false
jobs:
  fresh-bobo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free generation and video tools
        run: |
          pip install gradio_client numpy socksio piper-tts==1.3.0
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Cache free CPU voice model
        uses: actions/cache@v4
        with:
          path: voice_models/
          key: bobo-ljspeech-medium-v1
      - name: Prepare free local voice
        run: |
          mkdir -p voice_models
          cd voice_models
          if [ ! -f en_US-ljspeech-medium.onnx ]; then python -m piper.download_voices en_US-ljspeech-medium; fi
      - name: Generate a fresh episode and publish if enabled
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          PUBLISH_FACEBOOK: 'false'
          BOBO_VOICE_TEST: 'true'
        run: python fresh_bobo.py
      - name: Record publication and quota cooldown
        if: always()
        run: |
          if [ -f published_bobo.json ]; then
            git config user.name "Bobo automation"
            git config user.email "bobo-bot@users.noreply.github.com"
            git add published_bobo.json
            if [ -f bobo_quota.json ]; then git add bobo_quota.json; fi
            if [ -f bobo_review_pending.json ]; then git add bobo_review_pending.json; fi
            if ! git diff --cached --quiet; then
              git commit -m "Record fresh Bobo Facebook publication"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Save the new episode
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-bobo-video
          path: fresh_output/
          retention-days: 30

# Resume morning generation after deliberate stale-draft rejection, 2026-10-15.
