name: Daily Cartoon Bot

on:
  workflow_dispatch:
    inputs:
      story_name:
        description: 'Name of this Bobo story'
        required: false
        default: 'Bobo Cartoon'
        type: string

      add_captions:
        description: 'Add funny captions?'
        required: true
        default: true
        type: boolean

      add_music:
        description: 'Add background music?'
        required: true
        default: true
        type: boolean

      add_sfx:
        description: 'Add cartoon sound effects?'
        required: true
        default: true
        type: boolean

  schedule:
    - cron: '0 6 * * *'

jobs:
  cartoon-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub pillow

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create cartoon video
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          STORY_NAME: ${{ inputs.story_name || 'Bobo Cartoon' }}
          ADD_CAPTIONS: ${{ inputs.add_captions || 'true' }}
          ADD_MUSIC: ${{ inputs.add_music || 'true' }}
          ADD_SFX: ${{ inputs.add_sfx || 'true' }}
        run: |
          python bot.py

      - name: Save finished cartoon
        uses: actions/upload-artifact@v4
        with:
          name: bobo-cartoon-video
          path: bobo_cake_reel.mp4
      - name: Publish cartoon to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          curl --fail-with-body -X POST \
            "https://graph-video.facebook.com/v26.0/${FB_PAGE_ID}/videos" \
            -F "access_token=${FB_PAGE_ACCESS_TOKEN}" \
            -F "source=@bobo_cake_reel.mp4" \
            -F "description=😂 Bobo is back with another funny adventure! 🎬 Watch till the end and share the fun! 🐻✨ #BoboCartoon #FunnyCartoon #CartoonVideos #FunnyVideos #KidsCartoon #Animation #Comedy #FacebookReels"
