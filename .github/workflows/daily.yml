name: Daily Cartoon Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  cartoon-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create cartoon video
        run: |
          python bot.py
          
      - name: Save finished cartoon
        uses: actions/upload-artifact@v4
        with:
          name: bobo-cartoon-video
          path: bobo_cake_reel.mp4
