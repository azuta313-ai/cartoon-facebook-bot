name: Publish Authorized Bobo Photo
on:
  push:
    branches: [main]
    paths: ['bobo_photo_request.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: bobo-photo-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: fresh-bobo-video
          path: photo_source
          run-id: 38935041435
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install photo tools
        run: |
          pip install requests
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          git config user.name 'Bobo automation'
          git config user.email 'bobo-bot@users.noreply.github.com'
      - name: Publish exact selected still
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python publish_bobo_photo.py
