name: Collect Facebook Page Analytics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/facebook-analytics.yml']
  schedule:
    - cron: '20 23 * * *'
      timezone: Asia/Karachi
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: bobo-page-analytics
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Read Page and video insights
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python collect_facebook_analytics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bobo-page-analytics
          path: analytics_output/
          retention-days: 90
