name: Publish Reviewed Bobo
on:
  push:
    branches: [main]
    paths: ['bobo_review_approval.json']
  workflow_dispatch:
  schedule:
    - cron: '0,20,40 9,17 * * *'
      timezone: Asia/Karachi
permissions:
  contents: write
  actions: read
concurrency:
  group: free-bobo-generation
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: approval
        run: |
          python bobo_pipeline.py
          git config user.name 'Bobo automation'
          git config user.email 'bobo-bot@users.noreply.github.com'
          for directory in bobo_reserve bobo_pending; do
            if [ -d "$directory" ]; then git add "$directory"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Stage exact reviewed Bobo reserve and preserve pending records'
            git push origin HEAD:main
          fi
      - uses: actions/download-artifact@v4
        if: steps.approval.outputs.ready == 'true'
        with:
          name: fresh-bobo-video
          path: reviewed
          run-id: ${{ steps.approval.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        if: steps.approval.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Install publication tools
        if: steps.approval.outputs.ready == 'true'
        run: |
          pip install requests
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Publish exact approved file
        if: steps.approval.outputs.ready == 'true'
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,math,array
          from pathlib import Path
          import requests
          a=json.loads(Path('bobo_review_approval.json').read_text())
          ledger_path=Path('published_bobo.json')
          ledger=json.loads(ledger_path.read_text())
          key='long-v2-'+str(a['episode'])
          if key in ledger:
              print('Reviewed episode already published; no duplicate upload.')
              raise SystemExit(0)
          pending_path=Path('bobo_pending')/(str(a['episode'])+'.json')
          if not pending_path.exists(): pending_path=Path('bobo_review_pending.json')
          pending=json.loads(pending_path.read_text())
          assert pending['episode']==a['episode'] and pending['artifact_run_id']==str(a['artifact_run_id'])
          video=Path('reviewed/bobo_fresh.mp4')
          assert hashlib.sha256(video.read_bytes()).hexdigest()==a['final_sha256']
          duration=float(subprocess.check_output([
              'ffprobe','-v','error','-show_entries','format=duration',
              '-of','default=noprint_wrappers=1:nokey=1',str(video)
          ],text=True).strip())
          if not 10.95 <= duration <= 11.05:
              raise RuntimeError(f'Reviewed video duration {duration:.3f}s is outside the required 11-second target.')
          metadata=json.loads(Path('reviewed/episode.json').read_text())
          assert metadata['episode']==a['episode']
          assert not metadata.get('finishing_required',False), 'Observed-action finishing required before approval'
          # Validate speech in the actual encoded video, not merely a source WAV.
          dialogue=json.loads(Path('reviewed/dialogue-timing.json').read_text())
          assert dialogue.get('enabled') and metadata.get('voice',{}).get('enabled'), 'Mandatory Bobo voice missing'
          cues=dialogue.get('cues',[])
          assert len(cues)==1 and cues[0].get('text'), 'Exact spoken line missing'
          cue=cues[0]; start=float(cue['start']); end=float(cue['end'])
          assert 0<=start<end<=duration and .25<=end-start<=2.5
          captions=json.loads(Path('reviewed/captions-timing.json').read_text())
          assert any(x['text']==cue['text'] and abs(float(x['start'])-start)<.05 and abs(float(x['end'])-end)<.05 for x in captions), 'Spoken subtitle missing or mistimed'
          assert a['review'].get('voice',{}).get('subtitle_exact') and a['review']['voice'].get('track_present'), 'Voice/action review missing'
          def pcm(path):
              raw=subprocess.check_output(['ffmpeg','-v','error','-i',str(path),'-vn','-ar','48000','-ac','1','-f','s16le','-'])
              samples=array.array('h'); samples.frombytes(raw)
              return samples
          final=pcm(video); reference=pcm(Path('reviewed/voice-track.wav'))
          lo=round(start*48000); hi=round(end*48000)
          ref=reference[lo:hi]; actual=final[lo:hi]
          assert len(ref)==hi-lo and len(actual)==len(ref), 'Rendered dialogue truncated'
          energy=sum(float(x)*x for x in ref)
          assert energy/len(ref)>(32768*.025)**2, 'Voice reference too quiet'
          dot=sum(float(x)*y for x,y in zip(ref,actual))
          actual_energy=sum(float(x)*x for x in actual)
          correlation=dot/math.sqrt(max(1,energy*actual_energy))
          speech_gain=dot/energy
          speech_rms=speech_gain*math.sqrt(energy/len(ref))/32768
          assert correlation>.65 and speech_rms>.035, 'Encoded Bobo speech absent, masked or too quiet'
          print('Encoded speech gate passed:',round(correlation,3),round(speech_rms,4))
          # Approval must describe observed actions in this exact encoded file.
          review=a['review']
          assert review.get('reviewed_sha256')==a['final_sha256'], 'Alignment review is for a different file'
          assert review.get('full_render_sample_fps',0)>=4 and review.get('transition_sample_fps',0)>=8, 'Full visual/transition review incomplete'
          actions=review.get('observed_actions',{})
          assert actions, 'Observed action timestamps missing'
          def observed(name):
              value=actions[name]
              if isinstance(value,dict):
                  begin=float(value['start']); finish=float(value['end'])
              else:
                  begin,finish=map(float,value)
              assert 0<=begin<finish<=duration
              return begin,finish
          mapped=review.get('captions',[])
          assert len(mapped)==len(captions), 'Every caption needs observed-action review'
          for caption in captions:
              matches=[x for x in mapped if x.get('text')==caption['text'] and abs(float(x['start'])-float(caption['start']))<.05 and abs(float(x['end'])-float(caption['end']))<.05]
              assert len(matches)==1, 'Caption timing differs from reviewed mapping'
              item=matches[0]
              if caption['text']==cue['text']:
                  assert item.get('kind')=='spoken', 'Dialogue must be labelled spoken'
              else:
                  begin,finish=observed(item['observed_action'])
                  assert float(caption['start'])>=begin-.05 and float(caption['end'])<=finish+.05, 'Action caption is outside observed action'
                  if item.get('outcome'):
                      assert float(caption['start'])>=float(item['result_visible_at']), 'Outcome caption appears before visible result'
          assert review.get('effects_complete') is True, 'All audible effects must be reviewed'
          for effect in review.get('effects',[]):
              begin,finish=observed(effect['observed_action'])
              assert begin-.08<=float(effect['start'])<=finish+.08, 'Sound effect misses observed contact'
              assert effect.get('source') and effect.get('type') and effect.get('level') is not None, 'Effect source/type/level missing'
              assert effect.get('material_matched') is True and effect.get('restrained') is True, 'Effect suitability review missing'
          assert review.get('pacing',{}).get('purposeful_action_by',1)<=.5, 'Opening action review missing'
          assert review.get('music',{}) and review.get('voice',{}).get('mouth_action_reviewed') is True, 'Music or mouth-action review missing'
          assert not any(v.get('generated_sha256')==metadata['generated_sha256'] for v in ledger.values())
          intent=Path('bobo_publish_intent.json')
          if intent.exists():
              old=json.loads(intent.read_text())
              if old.get('episode')==a['episode'] and old.get('status')=='upload_started':
                  raise RuntimeError('Previous upload outcome unknown; refusing an automatic duplicate.')
          intent.write_text(json.dumps({'episode':a['episode'],'status':'upload_started','final_sha256':a['final_sha256']},indent=2))
          subprocess.run(['git','config','user.name','Bobo automation'],check=True)
          subprocess.run(['git','config','user.email','bobo-bot@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','bobo_publish_intent.json'],check=True)
          subprocess.run(['git','commit','-m','Record reviewed upload intent'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          with video.open('rb') as f:
              r=requests.post('https://graph-video.facebook.com/v26.0/'+os.environ['FB_PAGE_ID']+'/videos',headers={'Authorization':'Bearer '+os.environ['FB_PAGE_ACCESS_TOKEN']},files={'source':('bobo_fresh.mp4',f,'video/mp4')},data={'description':metadata['social_caption']},timeout=180)
          try: result=r.json()
          except ValueError: raise RuntimeError('Facebook returned an unreadable response; check upload outcome before retry.')
          if not r.ok or not result.get('id'):
              code=result.get('error',{}).get('code')
              intent.write_text(json.dumps({'episode':a['episode'],'status':'rejected','facebook_error_code':code},indent=2))
              subprocess.run(['git','add','bobo_publish_intent.json'],check=True)
              subprocess.run(['git','commit','-m','Record rejected reviewed upload'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)
              raise RuntimeError('Facebook rejected reviewed upload; error code '+str(code))
          from datetime import datetime
          from zoneinfo import ZoneInfo
          metadata.update(facebook_video_id=result['id'],final_sha256=a['final_sha256'],review=a,published_at=datetime.now(ZoneInfo('Asia/Karachi')).isoformat())
          ledger[key]=metadata
          ledger_path.write_text(json.dumps(ledger,indent=2))
          intent.write_text(json.dumps({'episode':a['episode'],'status':'accepted','facebook_video_id':result['id']},indent=2))
          pending_path.unlink()
          current_pending=Path('bobo_review_pending.json')
          if current_pending.exists() and json.loads(current_pending.read_text()).get('episode')==a['episode']:
              current_pending.unlink()
          subprocess.run(['git','add','published_bobo.json','bobo_publish_intent.json'],check=True)
          tracked=subprocess.check_output(['git','ls-files','bobo_pending/','bobo_review_pending.json'],text=True).splitlines()
          if tracked: subprocess.run(['git','add','-u','--']+tracked,check=True)
          subprocess.run(['git','commit','-m','Record reviewed Bobo publication and release generation gate'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          print('Facebook accepted reviewed video:',result['id'])
          PY

      - name: Publish exact approved video to Instagram
        if: steps.approval.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 7
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python publish_instagram_reviewed.py
      - name: Publish exact approved video as Instagram Story
        if: steps.approval.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 7
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_MEDIA_TYPE: STORIES
        run: python publish_instagram_reviewed.py
      - name: Share approved Bobo video as a Story
        if: steps.approval.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,time
          from pathlib import Path
          from urllib.parse import urlparse
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import requests
          approval=json.loads(Path('bobo_review_approval.json').read_text())
          ledger_path=Path('published_bobo.json')
          ledger=json.loads(ledger_path.read_text())
          key='long-v2-'+str(approval['episode'])
          record=ledger[key]
          assert record.get('facebook_video_id'), 'Main video must publish first'
          video=Path('reviewed/bobo_fresh.mp4')
          assert hashlib.sha256(video.read_bytes()).hexdigest()==approval['final_sha256']
          assert approval['review'].get('reviewed_sha256')==approval['final_sha256']
          # One Story per reviewed episode, maximum two in each Pakistan day.
          today=datetime.now(ZoneInfo('Asia/Karachi')).date().isoformat()
          if record.get('story'):
              print('Story already attempted; refusing duplicate.')
              raise SystemExit(0)
          attempts=sum(1 for x in ledger.values() if x.get('story',{}).get('date')==today)
          if attempts>=2:
              print('Two-Story daily limit reached.')
              raise SystemExit(0)
          headers={'Authorization':'Bearer '+os.environ['FB_PAGE_ACCESS_TOKEN']}
          base='https://graph.facebook.com/v26.0'
          edge=base+'/'+os.environ['FB_PAGE_ID']+'/video_stories'
          def save():
              ledger_path.write_text(json.dumps(ledger,indent=2))
              subprocess.run(['git','add','published_bobo.json'],check=True)
              subprocess.run(['git','commit','-m','Record reviewed Bobo Story status'],check=True)
              subprocess.run(['git','pull','--rebase','origin','main'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)
          def checked(response):
              try: result=response.json()
              except ValueError: raise RuntimeError('Story response unreadable; no automatic duplicate retry')
              if not response.ok or result.get('error'):
                  err=result.get('error',{})
                  raise RuntimeError('Story API error code '+str(err.get('code'))+' subcode '+str(err.get('error_subcode')))
              return result
          record['story']={'date':today,'status':'attempt_started','source_sha256':approval['final_sha256'],'strategy':'One reviewed, captioned, voiced mini-adventure per slot; no extra generation; test Story exposure and follower growth without attributing causation.'}
          save()
          try:
              result=checked(requests.post(edge,headers=headers,data={'upload_phase':'start'},timeout=30))
              sid=str(result['video_id']); url=result['upload_url']
              parsed=urlparse(url)
              assert parsed.scheme=='https' and parsed.hostname=='rupload.facebook.com', 'Unexpected Story upload host'
              record['story'].update(video_id=sid,status='upload_started'); save()
              with video.open('rb') as source:
                  checked(requests.post(url,headers={'Authorization':'OAuth '+os.environ['FB_PAGE_ACCESS_TOKEN'],'offset':'0','file_size':str(video.stat().st_size),'Content-Type':'application/octet-stream'},data=source,timeout=90))
              for _ in range(12):
                  status=checked(requests.get(base+'/'+sid,headers=headers,params={'fields':'status'},timeout=20)).get('status',{})
                  if status.get('uploading_phase',{}).get('status')=='complete':
                      break
                  time.sleep(3)
              else:
                  raise RuntimeError('Story upload not ready; held without duplicate retry')
              result=checked(requests.post(edge,headers=headers,data={'upload_phase':'finish','video_id':sid},timeout=30))
              assert result.get('success'), 'Facebook did not confirm Story acceptance'
              record['story'].update(status='accepted',post_id=result.get('post_id'),accepted_at=datetime.now(ZoneInfo('Asia/Karachi')).isoformat())
              save()
              print('Facebook accepted reviewed Story:',sid)
          except Exception as exc:
              record['story'].update(status='held',reason=type(exc).__name__+': '+str(exc)[:180])
              save()
              raise
          PY

